name: Publish to Comfy registry

on:
  workflow_dispatch:

concurrency:
  group: comfy-registry-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate release and prepare registry changelog
        shell: bash
        run: |
          python scripts/check_release.py
          python - <<'PY'
          import os
          import subprocess
          import sys
          import uuid

          body = subprocess.check_output(
              [sys.executable, "scripts/release_notes.py", "--body", "en"], text=True
          ).strip()
          delimiter = f"CHANGELOG_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"COMFY_NODE_CHANGELOG<<{delimiter}\n{body}\n{delimiter}\n")
          PY

      - name: Read package version
        id: package
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(f"node_id={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY

      - name: Show publish target
        run: echo "Preparing to publish ${{ steps.package.outputs.node_id }} ${{ steps.package.outputs.version }}"

      - name: Check registry version
        id: registry-version
        shell: bash
        env:
          NODE_ID: ${{ steps.package.outputs.node_id }}
          NODE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          node_id = os.environ["NODE_ID"]
          version = os.environ["NODE_VERSION"]
          params = urllib.parse.urlencode({
              "nodeId": node_id,
              "pageSize": "100",
          })
          url = f"https://api.comfy.org/versions?{params}"
          # Any existing status owns the version, including pending review.
          # Fail the check rather than risk republishing an unknown state.
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          exists = any(item.get("version") == version for item in payload.get("versions", []))
          print(f"exists={'true' if exists else 'false'}")
          if exists:
              print(f"::notice::Comfy registry already has {node_id} {version}; skipping publish.", file=sys.stderr)
          PY

      - name: Publish Custom Node
        if: steps.registry-version.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
