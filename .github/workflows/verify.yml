name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows verification
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Compile gallery backend
        run: python -m compileall py\gallery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gallery_ui/package-lock.json

      - name: Test ComfyUI LoRA bridge
        run: node --test tests/comfy_lora_stack_bridge.test.mjs

      - name: Install frontend dependencies
        working-directory: gallery_ui
        run: npm ci

      - name: Audit frontend translations
        working-directory: gallery_ui
        run: npm run audit:i18n

      - name: Typecheck frontend
        working-directory: gallery_ui
        run: npm run typecheck

      - name: Lint frontend
        working-directory: gallery_ui
        run: npm run lint

      - name: Test frontend
        working-directory: gallery_ui
        run: npm run test:run

      - name: Audit frontend dependencies
        working-directory: gallery_ui
        run: npm run audit:security

      - name: Build frontend
        working-directory: gallery_ui
        run: npm run build

      - name: Audit frontend dist assets
        working-directory: gallery_ui
        run: npm run audit:dist

      - name: Check release metadata
        run: powershell -ExecutionPolicy Bypass -File scripts\check-release.ps1

  lora-manager-upstream:
    name: LoRA Manager upstream integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned upstream sources (test only, not vendored)
        shell: bash
        run: |
          git init "$RUNNER_TEMP/ComfyUI-Lora-Manager"
          git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" remote add origin https://github.com/willmiao/ComfyUI-Lora-Manager.git
          git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" sparse-checkout set web/comfyui
          git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" fetch --depth 1 --filter=blob:none origin 0a262cbe0c0a773c174e6b4570c44671d6e2b9a3
          git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ComfyUI-Lora-Manager" rev-parse HEAD)" = 0a262cbe0c0a773c174e6b4570c44671d6e2b9a3
      - name: Test against actual upstream callbacks and widget setter
        env:
          LORA_MANAGER_SOURCE: ${{ runner.temp }}/ComfyUI-Lora-Manager
        run: node --test tests/comfy_lora_manager_upstream.test.mjs

  backend-matrix:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m compileall -q py
